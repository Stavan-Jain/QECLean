name = "QEC"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QEC"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Blueprint extraction (https://github.com/hanwenzhu/LeanArchitect). Pinned to
# the tag matching `lean-toolchain`; LeanArchitect publishes one tag per
# toolchain. Its own requires (batteries, Cli) are shared with mathlib, whose
# pins take precedence -- see the note on the mathlib require below.
# Only `QECBlueprint` imports it -- see the note in QECBlueprint.lean.
[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.36.0-rc2"

# Keep mathlib the LAST `require`: Lake lets a later require win when two
# packages pin the same dependency at different revisions, and LeanArchitect's
# tag pins batteries at the toolchain tag while mathlib master has usually moved
# past it. Mathlib's pins must win, or `lake exe cache get` computes hashes that
# match nothing on the cache server.
[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "QEC"

# Compatibility import surface for existing hosted-editor configurations.
# The heavy BB case studies now live in bb-distance-lean; see QECLight.lean.
[[lean_lib]]
name = "QECLight"

# Blueprint annotations for the whole library (root module `QECBlueprint.lean`).
# Deliberately NOT in `defaultTargets`: `lake build` should stay the plain
# library build, and only this target pulls in LeanArchitect. Build the LaTeX
# with `lake build QECBlueprint:blueprint`. The default glob is `.one`, so the
# library is exactly the single root module -- which is what makes the emitted
# index (`.lake/build/blueprint/library/QECBlueprint.tex`) contain every node.
[[lean_lib]]
name = "QECBlueprint"

[[lean_lib]]
name = "Foundations"
srcDir = "QEC"

# Infoview widgets (root module `QECWidgets.lean`): Pauli support strips,
# commutation parity views, and friends, built on ProofWidgets (already a
# transitive dependency via mathlib — no new `require`). Deliberately NOT in
# `defaultTargets` (same policy as QECBlueprint): only this target imports
# ProofWidgets, and `lake build` stays the plain library build. Build with
# `lake build QECWidgets`; it is part of the pre-push checklist in CLAUDE.md.
[[lean_lib]]
name = "QECWidgets"

