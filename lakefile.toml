name = "QEC"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QEC"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"

# Blueprint extraction (https://github.com/hanwenzhu/LeanArchitect). Pinned to
# the tag matching `lean-toolchain`; LeanArchitect publishes one tag per
# toolchain, and its own requires (batteries, Cli) are already pinned at
# v4.30.0-rc2 by mathlib, so adding it does not move any existing dependency.
# Only `QECBlueprint` imports it -- see the note in QECBlueprint.lean.
[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "QEC"

# Light import surface for memory-constrained environments; excludes the
# BivariateBicycle leaves, which need more than a 4-core container or a shared
# web-editor session has. Deliberately not in `defaultTargets` — `lake build`
# still means the full library. See `QECLight.lean`.
[[lean_lib]]
name = "QECLight"

# Blueprint annotations for the whole library (root module `QECBlueprint.lean`).
# Deliberately NOT in `defaultTargets`: `lake build` should stay the plain
# library build, and only this target pulls in LeanArchitect. Build the LaTeX
# with `lake build QECBlueprint:blueprint`. The default glob is `.one`, so the
# library is exactly the single root module -- which is what makes the emitted
# index (`.lake/build/blueprint/library/QECBlueprint.tex`) contain every node.
[[lean_lib]]
name = "QECBlueprint"

[[lean_lib]]
name = "Foundations"
srcDir = "QEC"

[[lean_lib]]
name = "RepetitionCode"
srcDir = "QEC"
